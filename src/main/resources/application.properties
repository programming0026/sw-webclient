spring.application.name=sw-webclient
server.port=8080

# Servicio que se consume. Por defecto es el proveedor incluido en esta misma aplicación;
# cambia la URL para consumir otra API (debe tener las mismas rutas /products).
app.products.base-url=http://localhost:${server.port}/provider
app.products.connect-timeout-ms=1000
app.products.response-timeout-ms=500
